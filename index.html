<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comet Kitchen</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hud" aria-label="Game status">
        <div>
          <span class="label">Score</span>
          <strong id="score">0</strong>
        </div>
        <div>
          <span class="label">Streak</span>
          <strong id="streak">x1</strong>
        </div>
        <div>
          <span class="label">Best</span>
          <strong id="best">0</strong>
        </div>
        <button id="pause" class="icon-button" type="button" aria-label="Pause game">II</button>
        <button id="mute" class="icon-button" type="button" aria-label="Toggle sound">♪</button>
      </section>

      <canvas id="game" width="960" height="600" aria-label="Comet Kitchen game area"></canvas>

      <section class="panel" id="panel">
        <h1>Comet Kitchen</h1>
        <p>Catch ingredients, dodge burnt meteors, and grab golden timers for slow motion.</p>
        <button id="start" type="button">Start cooking</button>
      </section>
    </main>

    <script type="module" src="./src/game.js"></script>
  </body>
</html>
